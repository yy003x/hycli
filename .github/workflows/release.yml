name: release
on:
  push:
    tags: ['v[0-9]*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: make check
      - name: Build and validate archives
        run: |
          version="${GITHUB_REF_NAME#v}"
          make release VERSION="$version"
          VERSION="$version" sh scripts/check-release.sh
      - name: Create draft release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release/"${GITHUB_REF_NAME#v}"/* --verify-tag --draft --title "$GITHUB_REF_NAME" --generate-notes
